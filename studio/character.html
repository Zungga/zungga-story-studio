<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Main character — Zungga Story Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f1a33; --purple:#7c3aed; --pink:#ec4899; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1830; font-family: "Fredoka", system-ui, sans-serif; color: var(--ink); }
  #stage { position: fixed; inset: 0 320px 0 0; display: flex; align-items: center; justify-content: center; }
  #stage canvas { display: block; touch-action: none; }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; background: #fff; overflow: auto; padding: 16px 16px 30px; box-shadow: -8px 0 30px #0004; }
  h1 { margin: 0 0 2px; font-size: 20px; } h1 span { color: var(--pink); }
  .sub { margin: 0 0 10px; color: #64748b; font-size: 13px; }
  h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #64748b; margin: 14px 0 7px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  button { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 10px; padding: 8px 8px; background: #f1f0f7; color: var(--ink); cursor: pointer; }
  button:hover { background: #e9e5fb; }
  button.on { background: linear-gradient(120deg, var(--purple), var(--pink)); color: #fff; }
  #status { position: fixed; left: 14px; bottom: 12px; color: #fff; font-size: 13px; background: #0008; padding: 6px 12px; border-radius: 999px; }
  #hint { position: fixed; left: 14px; top: 12px; color: #fff; font-size: 12.5px; background: #0006; padding: 6px 12px; border-radius: 12px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint">Drag to orbit · scroll to zoom</div>
<div id="status">Loading…</div>
<aside>
  <h1>Main character<span>.</span></h1>
  <p class="sub">The “I” of the story. Try every expression and move, in each place the story happens.</p>
  <h2>Version</h2>
  <div class="grid" id="variant"><button data-v="boy" class="on">👦 Boy</button><button data-v="girl">👧 Girl</button></div>
  <h2>Expression</h2>
  <div class="grid" id="expr"></div>
  <h2>Animation</h2>
  <div class="grid" id="anim"></div>
  <h2>In hand</h2>
  <div class="grid3" id="holds"><button data-h="">Nothing</button><button data-h="notes_30">₹30</button><button data-h="note_100">₹100</button><button data-h="pencil">Pencil</button><button data-h="chips">Chips</button><button data-h="juice">Juice</button></div>
  <h2>Place</h2>
  <div class="grid" id="place"><button data-p="studio" class="on">🎨 Studio</button><button data-p="bench">🪑 Ground bench</button><button data-p="classroom">🏫 Classroom</button><button data-p="shop">🏪 Shop</button></div>
  <h2>Camera</h2>
  <div class="grid" id="cam"><button data-c="full" class="on">Full body</button><button data-c="three">¾ view</button><button data-c="face">Face close-up</button><button data-c="turn">Turntable</button><button data-c="vertical">📱 9:16</button></div>
</aside>
<script src="../vendor/three.min.js"></script>
<script src="assets/core.js"></script>
<script src="assets/money.js"></script><script src="assets/food.js"></script><script src="assets/toys.js"></script><script src="assets/school.js"></script>
<script src="assets/furniture.js"></script><script src="assets/shop.js"></script><script src="assets/brand.js"></script><script src="assets/sets.js"></script>
<script src="characters/kid.js"></script>
<script type="module">
const T = THREE, $ = (s) => document.querySelector(s);
await document.fonts.load('700 40px Fredoka').catch(() => {});
const stage = $('#stage');
const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08; renderer.outputColorSpace = T.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(32, 1, 0.01, 200);
// film-style lighting: warm key, cool fill, rim light from behind
scene.add(new T.HemisphereLight(0xeaf2ff, 0xb59a7a, 0.9));
const key = new T.DirectionalLight(0xfff0dc, 2.6); key.position.set(2.5, 4, 3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0002; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 }); scene.add(key, key.target);
const fill = new T.DirectionalLight(0xbcd4ff, 0.7); fill.position.set(-3, 2, 2); scene.add(fill);
const rim = new T.DirectionalLight(0xffffff, 1.6); rim.position.set(-1, 3, -4); scene.add(rim);

// backdrops
const studio = new T.Group(); scene.add(studio);
{ const cyc = new T.Mesh(new T.SphereGeometry(30, 48, 24), new T.MeshBasicMaterial({ color: 0xf3eefe, side: T.BackSide })); studio.add(cyc);
  const fl = new T.Mesh(new T.CircleGeometry(30, 64), new T.MeshStandardMaterial({ color: 0xece6fb, roughness: 1 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; studio.add(fl); }
const outdoor = new T.Group(); scene.add(outdoor);
{ const g = new T.Mesh(new T.PlaneGeometry(80, 80), new T.MeshStandardMaterial({ color: 0xd8c39a, roughness: 1 })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; outdoor.add(g); }
const yard = ZAssets.build('school_ground').group; outdoor.add(yard);
const room = ZAssets.build('classroom').group; room.position.set(0, 0, 0); outdoor.add(room);
const shop = ZAssets.build('shop_counter').group; outdoor.add(shop);

let kid, holding = '', variant = 'boy';
function makeKid() {
  const old = kid; kid = ZCharacters.kid({ variant }); scene.add(kid.group);
  if (old) { kid.setExpression(old.expression); kid.play(old.animation); scene.remove(old.group); }
  applyHold(); applyPlace();
}
function applyHold() { kid.hold(holding ? (() => { const g = ZAssets.build(holding).group; if (holding.startsWith('note')) { g.rotation.set(Math.PI / 2, 0, 0); } if (holding === 'pencil') g.rotation.set(0, Math.PI / 2, 0.2); if (holding === 'chips') g.scale.setScalar(0.8); return g; })() : null, 'R'); }

let place = 'studio';
function applyPlace() {
  studio.visible = place === 'studio'; outdoor.visible = place !== 'studio';
  yard.visible = place === 'bench'; room.visible = place === 'classroom'; shop.visible = place === 'shop';
  scene.background = new T.Color(place === 'studio' ? 0xf3eefe : 0xbfe3ff); scene.fog = place === 'studio' ? null : new T.Fog(0xbfe3ff, 25, 70);
  kid.group.position.set(0, 0, 0); kid.group.rotation.y = 0;
  if (place === 'bench') { kid.group.position.set(0, 0, 0.12); }
  if (place === 'classroom') { kid.group.position.set(1.0 - 0.3, 0, 1.8 + 0.48 - 0.05); kid.group.rotation.y = Math.PI; }
  if (place === 'shop') { kid.group.position.set(0, 0, 1.0); kid.group.rotation.y = Math.PI; }
  setCam(camMode, true);
}

// camera
let camMode = 'full', yaw = 0.25, pitch = 0.08, dist = 3.2, look = new T.Vector3(0, 0.8, 0), turn = false;
function setCam(m, snap) {
  camMode = m; turn = m === 'turn';
  const base = kid ? kid.group.position.clone() : new T.Vector3();
  const facing = kid ? kid.group.rotation.y : 0;
  const sitting = kid && ['sit', 'sit_sad'].includes(kid.animation);
  const presets = { full: [0.0, 0.06, 3.3, sitting ? 0.62 : 0.76], three: [0.6, 0.1, 2.6, sitting ? 0.7 : 0.9], face: [0.25, 0.04, 0.72, sitting ? 0.98 : 1.24], turn: [0, 0.1, 3.1, sitting ? 0.62 : 0.76], vertical: [0.3, 0.08, 3.6, sitting ? 0.62 : 0.76] };
  const [y, p, d, h] = presets[m === 'vertical' ? 'vertical' : m];
  yaw = y + facing; pitch = p; dist = d; look = base.clone().add(new T.Vector3(0, h, 0));
  if (snap) camPos.copy(want());
}
const camPos = new T.Vector3();
const want = () => look.clone().add(new T.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dist));
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag.x) * 0.006; pitch = Math.max(-0.4, Math.min(1.2, pitch + (e.clientY - drag.y) * 0.004)); drag.x = e.clientX; drag.y = e.clientY; turn = false; });
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); dist = Math.max(0.35, Math.min(9, dist * Math.exp(e.deltaY * 0.0012))); }, { passive: false });

// UI
const status = (t) => { $('#status').textContent = t; };
function group(sel, attr, cb) { document.querySelectorAll(sel + ' button').forEach((b) => b.onclick = () => { document.querySelectorAll(sel + ' button').forEach((x) => x.classList.toggle('on', x === b)); cb(b.dataset[attr], b); }); }
makeKid();
$('#expr').innerHTML = kid.EXPRESSIONS.map((e) => `<button data-e="${e}" class="${e === 'neutral' ? 'on' : ''}">${e.replace('_', ' ')}</button>`).join('');
$('#anim').innerHTML = kid.ANIMATIONS.map((a) => `<button data-a="${a}" class="${a === 'idle' ? 'on' : ''}">${a.replace('_', ' ')}</button>`).join('');
group('#variant', 'v', (v) => { variant = v; makeKid(); status(`${v} · ${kid.expression} · ${kid.animation}`); });
group('#expr', 'e', (e) => { kid.setExpression(e); status(`expression: ${e}`); });
group('#anim', 'a', (a) => { kid.play(a); setCam(camMode); status(`animation: ${a}`); });
group('#holds', 'h', (h) => { holding = h; applyHold(); });
group('#place', 'p', (p) => { place = p; if (p === 'bench' || p === 'classroom') { kid.play('sit'); document.querySelectorAll('#anim button').forEach((x) => x.classList.toggle('on', x.dataset.a === 'sit')); } applyPlace(); });
group('#cam', 'c', (c) => { setCam(c); resize(); });

function resize() {
  const W = stage.clientWidth, H = stage.clientHeight; let w = W, h = H;
  if (camMode === 'vertical') { h = H - 24; w = Math.round(h * 9 / 16); }
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
setCam('full', true);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  kid.update(dt);
  if (turn) yaw += dt * 0.5;
  camPos.lerp(want(), 1 - Math.exp(-8 * dt)); camera.position.copy(camPos); camera.lookAt(look);
  key.target.position.copy(kid.group.position); key.position.copy(kid.group.position).add(new T.Vector3(2.5, 4, 3));
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
status('Boy · neutral · idle');
window.__ch = { get kid() { return kid; }, setCam, group, place: (p) => { place = p; applyPlace(); }, hold: (h) => { holding = h; applyHold(); }, variant: (v) => { variant = v; makeKid(); } };
</script>
</body>
</html>
